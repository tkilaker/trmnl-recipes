name = "trmnl"
main = "worker.js"
compatibility_date = "2026-10-01"
# trmnl.tomrad.se is the address everything uses. The workers.dev URL redirects there,
# except dn.json and sydsvenskan.json for installs made before the move (see worker.js).
workers_dev = true
routes = [{ pattern = "trmnl.tomrad.se", custom_domain = true }]

[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Store"]
